services:
  vinta3-core:
    build: .
    container_name: vinta-3-engine
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - vinta3_data:/app/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: vinta-3-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

volumes:
  vinta3_data:
