<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinta Pro v2.0 — Multi-Agent Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
      <h1 class="text-xl font-bold tracking-tight">VINTA PRO <span class="text-xs font-mono bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded ml-2">v2.0 Enterprise DAG</span></h1>
    </div>
    <div class="text-xs text-slate-400 font-mono">
      Planner • Researcher • Coder • Critic • Hybrid RAG
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Coluna de Comando -->
    <section class="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col gap-4">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Nova Missão Autônoma</h2>
      <textarea
        id="goalInput"
        rows="4"
        placeholder="Descreva um objetivo complexo para o enxame de agentes Vinta Pro..."
        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"
      >Realizar diagnóstico completo de recursos do servidor, validar sandbox de código e consolidar relatório executivo.</textarea>
      <button
        id="runBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-500 transition font-semibold py-2.5 px-4 rounded-lg text-sm shadow-lg shadow-indigo-600/20"
      >
        Executar Orquestração Multi-Agente
      </button>

      <div class="border-t border-slate-800 pt-4 mt-2">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Ingestão de Memória RAG</h3>
        <input id="memInput" type="text" placeholder="Adicionar fato ou regra na memória vetorial..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs mb-2" />
        <button id="memBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-xs py-2 rounded-lg">Salvar na Memória Semântica</button>
      </div>
    </section>

    <!-- Coluna de Telemetria DAG e Eventos -->
    <section class="lg:col-span-2 flex flex-col gap-6">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Stream de Eventos em Tempo Real (WebSocket)</h2>
        <div id="eventsLog" class="bg-slate-950 border border-slate-800 rounded-lg p-4 h-64 overflow-y-auto font-mono text-xs space-y-2">
          <div class="text-slate-500">Aguardando submissão de missão...</div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Síntese Final & Auditoria do Crítico</h2>
        <pre id="finalOutput" class="bg-slate-950 border border-slate-800 rounded-lg p-4 text-xs text-slate-200 whitespace-pre-wrap min-h-[160px]">Nenhum resultado processado ainda.</pre>
      </div>
    </section>
  </main>

  <script>
    const socket = io();
    const eventsLog = document.getElementById('eventsLog');
    const finalOutput = document.getElementById('finalOutput');
    const runBtn = document.getElementById('runBtn');
    const goalInput = document.getElementById('goalInput');
    const memBtn = document.getElementById('memBtn');
    const memInput = document.getElementById('memInput');

    function appendLog(badge, text, color = 'text-indigo-400') {
      const div = document.createElement('div');
      const time = new Date().toLocaleTimeString();
      div.innerHTML = `<span class="text-slate-600">[${time}]</span> <span class="${color} font-bold">[${badge}]</span> <span>${text}</span>`;
      eventsLog.appendChild(div);
      eventsLog.scrollTop = eventsLog.scrollHeight;
    }

    socket.on('agent_event', (ev) => {
      if (ev.type === 'plan_created') {
        appendLog('PLANNER', `Grafo DAG criado com ${ev.payload.plan.steps.length} etapas.`, 'text-amber-400');
      } else if (ev.type === 'step_started') {
        appendLog('STEP', `Iniciando Etapa ${ev.payload.step.stepNumber}: ${ev.payload.step.title} (${ev.payload.step.assignedRole})`, 'text-sky-400');
      } else if (ev.type === 'tool_invoked') {
        appendLog('TOOL', `Executando ${ev.payload.toolName}...`, 'text-purple-400');
      } else if (ev.type === 'critic_review') {
        appendLog('CRITIC', `Score: ${ev.payload.score} — ${ev.payload.notes}`, 'text-emerald-400');
      } else if (ev.type === 'task_completed') {
        appendLog('DONE', 'Orquestração concluída com sucesso!', 'text-emerald-300');
        finalOutput.textContent = ev.payload.finalOutput;
      }
    });

    runBtn.addEventListener('click', async () => {
      const goal = goalInput.value.trim();
      if (!goal) return;
      eventsLog.innerHTML = '';
      finalOutput.textContent = 'Processando grafo de agentes...';
      appendLog('SYSTEM', `Submetendo missão: "${goal}"`);
      socket.emit('run_goal', { goal });
    });

    memBtn.addEventListener('click', async () => {
      const content = memInput.value.trim();
      if (!content) return;
      await fetch('/api/v1/memory/ingest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content, tags: ['manual_ui'] })
      });
      memInput.value = '';
      appendLog('MEMORY', `Memória semântica indexada: "${content}"`, 'text-teal-400');
    });
  </script>
</body>
</html>
